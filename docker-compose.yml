services:
  app:
    env_file:
      - .env
    image: ghcr.io/nulldeploy/toolkit:latest
    container_name: toolkit
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - toolkit_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - toolkit_net

networks:
  toolkit_net:
