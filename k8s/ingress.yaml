apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toolkit-app-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: toolkit-app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: toolkit-app-service
                port:
                  number: 80
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: toolkit-app-service
                port:
                  number: 80