apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolkit-app
  namespace: default
  labels:
    app: toolkit-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: toolkit-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1      
      maxUnavailable: 0  
  template:
    metadata:
      labels:
        app: toolkit-app
    spec:
      containers:
        - name: toolkit-app
          image: toolkit-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5